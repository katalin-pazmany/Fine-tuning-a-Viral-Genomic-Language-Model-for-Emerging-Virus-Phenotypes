<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Viral Phenotype Network · Vir2vec</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#060a12; overflow:hidden; font-family:'SF Mono','Fira Code',monospace; }
#sigma-container { width:100vw; height:100vh; }
.corner { position:absolute; width:14px; height:14px; }
.tl { top:10px; left:10px; border-top:1px solid rgba(100,200,255,0.35); border-left:1px solid rgba(100,200,255,0.35); }
.tr { top:10px; right:10px; border-top:1px solid rgba(100,200,255,0.35); border-right:1px solid rgba(100,200,255,0.35); }
.bl { bottom:10px; left:10px; border-bottom:1px solid rgba(100,200,255,0.35); border-left:1px solid rgba(100,200,255,0.35); }
.br { bottom:10px; right:10px; border-bottom:1px solid rgba(100,200,255,0.35); border-right:1px solid rgba(100,200,255,0.35); }
#title { position:fixed; top:18px; left:22px; pointer-events:none; }
#title .sys { font-size:9px; letter-spacing:0.14em; color:rgba(100,200,255,0.5); text-transform:uppercase; }
#title .main { font-size:12px; color:rgba(180,220,255,0.9); margin-top:3px; }
#controls { position:fixed; top:18px; right:18px; display:flex; gap:5px; }
.btn { background:transparent; border:1px solid rgba(100,200,255,0.15); color:rgba(100,200,255,0.5); font-size:9px; font-family:inherit; letter-spacing:0.1em; padding:5px 10px; cursor:pointer; text-transform:uppercase; border-radius:2px; transition:all 0.15s; }
.btn:hover, .btn.active { background:rgba(100,200,255,0.08); border-color:rgba(100,200,255,0.4); color:rgba(100,200,255,1); }
#legend { position:fixed; bottom:20px; left:20px; display:flex; flex-direction:column; gap:5px; pointer-events:none; }
.leg { display:flex; align-items:center; gap:7px; font-size:9px; letter-spacing:0.08em; color:rgba(255,255,255,0.4); text-transform:uppercase; }
.ld { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
#hint { position:fixed; bottom:20px; right:20px; font-size:9px; color:rgba(100,200,255,0.2); letter-spacing:0.08em; text-transform:uppercase; pointer-events:none; }
#tooltip { position:fixed; display:none; background:#040810; border:1px solid #1a9fff; border-radius:4px; padding:14px 18px; min-width:240px; pointer-events:none; z-index:9999; box-shadow:0 0 20px rgba(0,150,255,0.2); }
#tt-name { font-size:12px; color:#00ccff; margin-bottom:10px; letter-spacing:0.04em; font-weight:600; }
.tt-row { font-size:10px; color:#6688aa; display:flex; justify-content:space-between; gap:20px; margin-top:5px; text-transform:uppercase; letter-spacing:0.06em; }
.tt-val { color:#ffffff; font-weight:500; }
#loading { position:fixed; inset:0; background:#060a12; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:200; transition:opacity 0.5s; }
#loading .msg { font-size:10px; letter-spacing:0.2em; color:rgba(100,200,255,0.7); text-transform:uppercase; margin-bottom:16px; }
#lbw { width:280px; height:2px; background:rgba(100,200,255,0.1); border-radius:1px; }
#lb { height:100%; width:0%; background:rgba(100,200,255,0.8); border-radius:1px; transition:width 0.4s; }
#ls { font-size:9px; letter-spacing:0.12em; color:rgba(100,200,255,0.35); margin-top:10px; text-transform:uppercase; }
</style>
</head>
<body>
<div id="loading">
  <div class="msg">Viral Phenotype Network · Vir2vec</div>
  <div id="lbw"><div id="lb"></div></div>
  <div id="ls">Loading...</div>
</div>
<div id="sigma-container"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div id="title">
  <div class="sys">EID2 × Vir2vec embeddings · SVM predictions</div>
  <div class="main" id="count-label">Loading...</div>
</div>
<div id="controls">
  <button class="btn active" id="btn-all" onclick="setFilter('all')">All</button>
  <button class="btn" id="btn-h2h" onclick="setFilter('h2h')">H2H risk</button>
  <button class="btn" id="btn-zoo" onclick="setFilter('zoo')">Zoonotic</button>
  <button class="btn" id="btn-both" onclick="setFilter('both')">Both risks</button>
  <button class="btn" id="btn-labelled" onclick="setFilter('labelled')">Labelled only</button>
  <button class="btn" id="btn-edges" class="btn active" onclick="toggleEdges()">Show edges</button>
</div>
<div id="legend">
  <div style="font-size:9px;letter-spacing:0.1em;color:rgba(100,200,255,0.3);text-transform:uppercase;margin-bottom:3px;">Node size = predicted risk</div>
  <div class="leg"><div class="ld" style="background:#3b82f6"></div>Low risk</div>
  <div class="leg"><div class="ld" style="background:#f97316"></div>H2H transmissible</div>
  <div class="leg"><div class="ld" style="background:#10b981"></div>Zoonotic spillover</div>
  <div class="leg"><div class="ld" style="background:#a855f7"></div>Both risks</div>
</div>
<div id="hint">scroll to zoom · drag to pan · hover node</div>
<div id="tooltip">
  <div id="tt-name">—</div>
  <div class="tt-row"><span>Family</span><span class="tt-val" id="tt-fam">—</span></div>
  <div class="tt-row"><span>H2H predicted risk</span><span class="tt-val" id="tt-h2h">—</span></div>
  <div class="tt-row"><span>Zoonotic predicted risk</span><span class="tt-val" id="tt-zoo">—</span></div>
  <div class="tt-row"><span>Data source</span><span class="tt-val" id="tt-src">—</span></div>
</div>
<script>
function setLoading(pct, msg) {
  document.getElementById('lb').style.width = pct + '%';
  document.getElementById('ls').textContent = msg;
}

function riskSize(h, z, famous, labelled) {
  if (famous) return 10;
  var r = Math.max(h, z);
  if (r > 0.85) return 6;
  if (r > 0.7)  return 5;
  if (r > 0.5)  return 4;
  if (labelled) return 3;
  return 2;
}

function nodeColor(h, z) {
  if (h > 0.6 && z > 0.5) return '#a855f7';
  if (h > 0.6) return '#f97316';
  if (z > 0.5) return '#10b981';
  return '#3b82f6';
}

var graph, renderer, edgesVisible = false;

fetch('./src/virus_network_data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    setLoading(40, 'Building graph...');
    
    graph = new graphology.Graph({ multi: false, type: 'undirected' });
    
    data.nodes.forEach(function(n) {
      var size = riskSize(n.h2h, n.zoo, n.famous, n.labelled);
      graph.addNode(n.id, {
        x: n.x, y: n.y, size: size,
        color: nodeColor(n.h2h, n.zoo),
        originalColor: nodeColor(n.h2h, n.zoo),
        label: '',
        h2h: n.h2h, zoo: n.zoo,
        family: n.family || 'Unknown',
        fullLabel: n.label || ('Taxid ' + n.id),
        labelled: n.labelled,
        famous: n.famous,
      });
    });

    setLoading(65, 'Adding connections...');
    
    data.edges.forEach(function(e) {
      if (graph.hasNode(e.source) && graph.hasNode(e.target) && !graph.hasEdge(e.source, e.target)) {
        graph.addEdge(e.source, e.target, {
          size: 0.2,
          color: 'rgba(100,200,255,0.015)',
          
        });
      }
    });

    setLoading(85, 'Rendering...');
    
    document.getElementById('count-label').textContent =
      data.nodes.length.toLocaleString() + ' viruses · ' + data.edges.length.toLocaleString() + ' connections';

    renderer = new Sigma(graph, document.getElementById('sigma-container'), {
      renderEdgeLabels: false,
      labelFont: 'SF Mono, monospace',
      labelSize: 12,
      labelColor: { color: '#00ddff' },
      defaultEdgeType: 'line',
      labelBackgroundColor: 'transparent',
      labelPadding: 0,
      backgroundColor: '#060a12',
      minCameraRatio: 0.02,
      maxCameraRatio: 20,
    });

    var tt = document.getElementById('tooltip');

    renderer.on('enterNode', function(e) {
      var node = e.node;
      var a = graph.getNodeAttributes(node);
      document.getElementById('tt-name').textContent = a.fullLabel;
      document.getElementById('tt-fam').textContent  = a.family;
      document.getElementById('tt-h2h').textContent  = (a.h2h * 100).toFixed(1) + '%';
      document.getElementById('tt-zoo').textContent  = (a.zoo * 100).toFixed(1) + '%';
      document.getElementById('tt-src').textContent  = a.labelled ? 'Ground truth (EID2)' : 'Pseudo-label';
      tt.style.display = 'block';
      graph.forEachNeighbor(node, function(n) {
        graph.setNodeAttribute(n, 'color', '#ffffff44');
      });
    });

    renderer.on('leaveNode', function() {
      tt.style.display = 'none';
      graph.forEachNode(function(n, a) { graph.setNodeAttribute(n, "color", a.originalColor); });
      renderer.refresh();
    });

    document.getElementById('sigma-container').addEventListener('mousemove', function(e) {
      if (tt.style.display === 'block') {
        tt.style.left = Math.min(e.clientX + 16, window.innerWidth  - 260) + 'px';
        tt.style.top  = Math.min(e.clientY - 10, window.innerHeight - 180) + 'px';
      }
    });

    // Simple force layout running in background
    var forceRunning = true;
    var forceIter = 0;
    var maxIter = 200;
    var k = 2.0;
    var cooling = 0.95;
    var temp = 5.0;

    function forceStep() {
      if (!forceRunning || forceIter >= maxIter) return;

      var nodes = graph.nodes();
      var disp = {};
      nodes.forEach(function(n) { disp[n] = {x:0, y:0}; });

      // Repulsion
      for (var i = 0; i < nodes.length; i++) {
        var ai = graph.getNodeAttributes(nodes[i]);
        for (var j = i+1; j < nodes.length; j++) {
          var aj = graph.getNodeAttributes(nodes[j]);
          var dx = ai.x - aj.x;
          var dy = ai.y - aj.y;
          var dist = Math.sqrt(dx*dx + dy*dy) || 0.01;
          var force = (k*k) / dist;
          disp[nodes[i]].x += (dx/dist) * force;
          disp[nodes[i]].y += (dy/dist) * force;
          disp[nodes[j]].x -= (dx/dist) * force;
          disp[nodes[j]].y -= (dy/dist) * force;
        }
      }

      // Attraction
      graph.forEachEdge(function(e, a, s, t) {
        var as = graph.getNodeAttributes(s);
        var at = graph.getNodeAttributes(t);
        var dx = as.x - at.x;
        var dy = as.y - at.y;
        var dist = Math.sqrt(dx*dx + dy*dy) || 0.01;
        var force = (dist*dist) / k;
        disp[s].x -= (dx/dist) * force;
        disp[s].y -= (dy/dist) * force;
        disp[t].x += (dx/dist) * force;
        disp[t].y += (dy/dist) * force;
      });

      // Apply
      nodes.forEach(function(n) {
        var a = graph.getNodeAttributes(n);
        var dx = disp[n].x;
        var dy = disp[n].y;
        var dist = Math.sqrt(dx*dx + dy*dy) || 0.01;
        var move = Math.min(dist, temp);
        graph.setNodeAttribute(n, 'x', a.x + (dx/dist)*move);
        graph.setNodeAttribute(n, 'y', a.y + (dy/dist)*move);
      });

      temp *= cooling;
      forceIter++;
      renderer.refresh();
      if (forceIter % 10 === 0) requestAnimationFrame(forceStep);
      else forceStep();
    }
    requestAnimationFrame(forceStep);
    setLoading(100, 'Ready!');
    setTimeout(function() {
      var loading = document.getElementById('loading');
      loading.style.opacity = '0';
      setTimeout(function() { loading.remove(); }, 500);
    }, 400);
  })
  .catch(function(err) {
    document.getElementById('ls').textContent = 'Error: ' + err.message;
    console.error(err);
  });

function setFilter(f) {
  document.querySelectorAll('.btn:not(#btn-edges)').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('btn-' + f).classList.add('active');
  graph.forEachNode(function(node, a) {
    var vis = true;
    if (f === 'h2h')      vis = a.h2h > 0.6;
    else if (f === 'zoo') vis = a.zoo > 0.5;
    else if (f === 'both') vis = a.h2h > 0.6 && a.zoo > 0.5;
    else if (f === 'labelled') vis = a.labelled;
    graph.setNodeAttribute(node, 'hidden', !vis);
  });
  graph.forEachEdge(function(e, _a, s, t) {
    graph.setEdgeAttribute(e, 'hidden',
      graph.getNodeAttribute(s, 'hidden') || graph.getNodeAttribute(t, 'hidden') || !edgesVisible
    );
  });
  var vis = graph.nodes().filter(function(n) { return !graph.getNodeAttribute(n, 'hidden'); });
  document.getElementById('count-label').textContent = vis.length.toLocaleString() + ' viruses visible';
}

function toggleEdges() {
  edgesVisible = !edgesVisible;
  document.getElementById('btn-edges').classList.toggle('active', edgesVisible);
  graph.forEachEdge(function(e, _a, s, t) {
    graph.setEdgeAttribute(e, 'hidden',
      !edgesVisible || graph.getNodeAttribute(s, 'hidden') || graph.getNodeAttribute(t, 'hidden')
    );
  });
}
</script>
</body>
</html>
